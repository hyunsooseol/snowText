
title: Korean Lexicon Analysis
name: klexicon
jus: '3.0'
stage: 0
compilerMode: tame

children:

  # ============================================================
  # Text Variable
  # ============================================================

  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:

      - type: TargetLayoutBox
        label: Text Variable
        children:

          - type: VariablesListBox
            name: textVar
            isTarget: true
            maxItemCount: 1
            height: normal
            ghostText: drag a text column here


  # ============================================================
  # Lexicon
  # ============================================================

  - type: CollapseBox
    label: Lexicon
    collapsed: false
    stretchFactor: 2
    children:

      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:

          - type: ListBox
            name: lexicon
            height: large
            showColumnHeaders: true
            fullRowSelect: true
            stretchFactor: 1
            addButton: Add category

            columns:

              - name: category
                label: Category
                stretchFactor: 1
                template:
                  type: TextBox
                  label: ''
                  format: string

              - name: terms
                label: Terms
                stretchFactor: 3
                template:
                  type: TextBox
                  label: ''
                  format: string


  # ============================================================
  # Korean Matching
  # ============================================================

  - type: CollapseBox
    label: Korean Matching
    collapsed: true
    stretchFactor: 1
    children:

      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:

          - type: CheckBox
            name: normalizeKorean

          - type: ComboBox
            name: negationMode
            label: Negation handling

          - type: TextBox
            name: negationWindow
            label: Negation window
            format: number


  # ============================================================
  # Korean Negation Cues
  # ============================================================

  - type: CollapseBox
    label: Korean Negation Cues
    collapsed: true
    stretchFactor: 1
    children:

      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:

          - type: TextBox
            name: negationCues
            label: Negation cues
            format: string
            stretchFactor: 1


  # ============================================================
  # Results
  # ============================================================

  - type: CollapseBox
    label: Results
    collapsed: true
    stretchFactor: 1
    children:

      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        fitToGrid: true
        children:
          - type: Label
            label: 'Tables'        
            children:
              - type: CheckBox
                name: documentDetails
    
              - type: CheckBox
                name: negationEvidence

      - type: LayoutBox
        stretchFactor: 1
        margin: large
        cell:
          column: 1
          row: 0
        fitToGrid: true
        children:
          - type: Label
            label: 'Plots'
            children:
              - type: CheckBox
                name: categoryPlot
    
              - type: CheckBox
                name: negationImpactPlot
            
  # ============================================================
  # Save
  # ============================================================

  - type: CollapseBox
    label: Save
    collapsed: true
    stretchFactor: 1
    children:
      - type: Output
        name: saveResults
      - type: Output
        name: detectedWords

